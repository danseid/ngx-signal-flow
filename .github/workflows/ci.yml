name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run audit

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run build:lib
      - run: npm run test:example
      - run: npm run --silent performance:check > performance-report.json
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: dist/ngx-signal-flow
      - uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            coverage/ngx-signal-flow/coverage-summary.json
            performance-report.json

  compatibility:
    needs: test
    name: compatibility (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum
            angular: '19.0'
            rxjs: '7.5.5'
            immer: '10.1'
            typescript: '5.5'
          - name: latest
            angular: '22'
            rxjs: '7'
            immer: '11'
            typescript: '6.0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
      - uses: actions/download-artifact@v8
        with:
          name: package
          path: dist/ngx-signal-flow
      - run: >-
          node tools/compatibility.mjs
          --angular ${{ matrix.angular }}
          --rxjs ${{ matrix.rxjs }}
          --immer ${{ matrix.immer }}
          --typescript ${{ matrix.typescript }}

  badges:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
      - uses: actions/download-artifact@v8
        with:
          name: reports
      - name: Publish badges
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node tools/badges.mjs --out badges
          cd badges
          git init --quiet --initial-branch=badges
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet --message "chore: update badges for ${GITHUB_SHA}"
          git push --force --quiet "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

  release:
    needs: [audit, lint, test, compatibility]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run build:lib
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
